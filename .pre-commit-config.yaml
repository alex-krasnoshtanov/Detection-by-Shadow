repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      # Notebooks in notebooks/ are kept as as-run artifacts, outputs and all,
      # so the usual "no large files" guard needs a generous ceiling.
      - id: check-added-large-files
        args: [--maxkb=8192]
