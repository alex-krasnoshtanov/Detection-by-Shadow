[project]
name = "shadow-detection"
version = "1.0.0"
description = "Locating an off-frame pedestrian from the shadow they cast into the frame"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oleksii Krasnoshtanov" }]
requires-python = ">=3.12"
keywords = ["computer-vision", "shadow", "object-localisation", "pytorch", "resnet"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]
demo = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
shadow-detection = "shadow_detection.cli:main"


[project.urls]
Homepage = "https://github.com/alex-krasnoshtanov/Detection-by-Shadow"
Method = "https://github.com/alex-krasnoshtanov/Detection-by-Shadow/blob/main/docs/method.md"
Experiments = "https://github.com/alex-krasnoshtanov/Detection-by-Shadow/blob/main/docs/experiments.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # torch 2.14 deprecates the TorchScript API in favour of torch.export, but
    # the released weights ship as a TorchScript archive, so loading them is
    # still required. Revisit if the artifact is ever re-exported.
    "default:`torch.jit.(load|save|trace|trace_method)` is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "explorations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
