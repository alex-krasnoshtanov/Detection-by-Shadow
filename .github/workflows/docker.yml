name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - "src/shadow_detection/demo/**"
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once, load locally, smoke-test it, and only then push. Publishing
      # an image that cannot boot is worse than not publishing one, and the
      # failure mode this catches is real: the app imports torch, torchvision,
      # scipy and scikit-learn at module scope, so one missing wheel in the
      # slimmed dependency list breaks startup and nothing else would notice.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shadow-detection:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          # No release exists until weights are published, so an unreachable
          # model URL is the expected state. The app is designed to start
          # anyway and report why, which is exactly what this asserts.
          docker run -d --name smoke -p 8000:8000 \
            -e SHADOW_MODEL_URL=https://example.invalid/none.tar.gz \
            shadow-detection:smoke

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
              http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "server responded with $code after ${attempt}s"
              cat /tmp/health.json
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "server never responded"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          # The page and its assets must be served from inside the image --
          # the static files are package data, and a packaging mistake would
          # leave them out of the wheel with no other symptom.
          for path in / /static/app.js /static/style.css; do
            curl -sf -o /dev/null "http://127.0.0.1:8000${path}"
            echo "ok ${path}"
          done

          docker logs smoke
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
