name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Lint
        run: uvx ruff@0.6.9 check .
      - name: Format check
        run: uvx ruff@0.6.9 format --check .

  test:
    runs-on: ubuntu-latest
    env:
      # PyPI's default torch wheel bundles CUDA (~2.5 GB). The CPU index is
      # enough for the test suite and keeps the job under a minute.
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Test
        run: pytest
